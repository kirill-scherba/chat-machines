# Chat Machines reverse proxy — installed on Hetzner VPS
# chat.bmat.uk → Cloudflare → nginx → localhost:8084 (ECC)

server {
    listen 80;
    server_name chat.bmat.uk;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name chat.bmat.uk;

    ssl_certificate     /etc/nginx/ssl/bmat.uk.crt;
    ssl_certificate_key /etc/nginx/ssl/bmat.uk.key;

    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
